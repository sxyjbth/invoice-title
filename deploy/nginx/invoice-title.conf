# 此文件作为 location 片段包含进现有 IP server 块，不声明 listen/server，避免覆盖其他项目。
location = /invoice {
    return 302 /invoice/employee;
}

location = /invoice/employee {
    alias /opt/invoice-title/current/frontend/employee-h5/index.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /invoice/finance {
    alias /opt/invoice-title/current/frontend/finance-admin/index.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ^~ /invoice/api/ {
    proxy_pass http://127.0.0.1:28082/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

location = /invoice/employee/ {
    return 302 /invoice/employee;
}

location ^~ /invoice/employee/assets/ {
    alias /opt/invoice-title/current/frontend/employee-h5/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /invoice/employee/invoice-title-qr.png {
    alias /opt/invoice-title/current/frontend/employee-h5/invoice-title-qr.png;
}

location = /invoice/employee/favicon.svg {
    alias /opt/invoice-title/current/frontend/employee-h5/favicon.svg;
    default_type image/svg+xml;
    add_header Cache-Control "no-cache" always;
}

location = /invoice/finance/ {
    return 302 /invoice/finance;
}

location ^~ /invoice/finance/assets/ {
    alias /opt/invoice-title/current/frontend/finance-admin/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /invoice/finance/favicon.svg {
    alias /opt/invoice-title/current/frontend/finance-admin/favicon.svg;
    default_type image/svg+xml;
    add_header Cache-Control "no-cache" always;
}
