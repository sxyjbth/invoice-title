worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        charset utf-8;
        client_max_body_size 20m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /invoice {
            return 302 /invoice/employee/?corpCode=sebo;
        }

        location = /invoice/employee {
            return 308 /invoice/employee/$is_args$args;
        }

        location = /invoice/finance {
            return 308 /invoice/finance/$is_args$args;
        }

        location ^~ /invoice/api/ {
            proxy_pass http://backend:28082/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location = /invoice/employee/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location ^~ /invoice/employee/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ^~ /invoice/employee/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri $uri/ /invoice/employee/index.html;
        }

        location = /invoice/finance/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location ^~ /invoice/finance/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ^~ /invoice/finance/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri $uri/ /invoice/finance/index.html;
        }
    }
}
