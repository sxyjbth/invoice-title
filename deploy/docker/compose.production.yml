name: invoice-title

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: invoice-title-backend:${INVOICE_IMAGE_TAG:-local}
    container_name: invoice-title-backend
    env_file:
      - /opt/invoice-title/config/invoice-title.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 28082
    volumes:
      - /data/invoice-title/imports:/var/lib/invoice-title/imports
    networks:
      - app
      - mysql
    expose:
      - "28082"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 http://127.0.0.1:28082/v3/api-docs >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1200m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: invoice-title-web:${INVOICE_IMAGE_TAG:-local}
    container_name: invoice-title-web
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
      - edge
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep --quiet '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  app:
    name: invoice-title-app
    internal: true
  edge:
    name: invoice-title-edge
  mysql:
    name: sebo-meal-network
    external: true
